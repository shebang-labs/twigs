name: A Twig does not work
description: A Twig fails to install, build, or check on a Hub, or is out of date.
labels: ["bug"]
body:
  - type: input
    id: twig
    attributes:
      label: Twig and version
      placeholder: "kubernetes 1.0.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The install refusal, the build log lines, or the check's result, with anything secret removed.
    validations:
      required: true
  - type: input
    id: hub
    attributes:
      label: Hub version
      description: Settings in the console, or GET /v1/meta.
  - type: input
    id: arch
    attributes:
      label: Runner architecture
      placeholder: "linux/amd64"
