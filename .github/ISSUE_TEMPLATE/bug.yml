name: A Twig does not work
description: A Twig fails to install, build, or check on a Nest, or is out of date.
labels: ["bug"]
body:
  - type: input
    id: twig
    attributes:
      label: Twig and version
      placeholder: "kubernetes 1.0.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The install refusal, the build log lines, or the check's result, with anything secret removed.
    validations:
      required: true
  - type: input
    id: nest
    attributes:
      label: Nest version
      description: In the console, under Settings.
  - type: input
    id: arch
    attributes:
      label: Runner architecture
      placeholder: "linux/amd64"
