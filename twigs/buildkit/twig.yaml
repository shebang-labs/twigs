# yaml-language-server: $schema=https://raw.githubusercontent.com/shebang-labs/twigs/main/schema/twig.json
twig: twig-nest/twig/v1
name: buildkit
version: 1.0.0
summary: BuildKit's buildctl, to build images from a Runner
publisher: Twig Nest project
license: Apache-2.0
tags:
- build
tools:
- id: buildctl
  version: 0.33.1
  summary: The BuildKit client, which Forge runs build Jobs with
  install: |
    ARG TARGETARCH
    RUN set -eu; \
        case "${TARGETARCH}" in \
          amd64) url=https://github.com/moby/buildkit/releases/download/v0.33.1/buildkit-v0.33.1.linux-amd64.tar.gz sha=4e044bcd62a0c0bbe6a8c94d73989de2bfe4c04dbc0f9d6021cf96b72cd1d965 ;; \
          arm64) url=https://github.com/moby/buildkit/releases/download/v0.33.1/buildkit-v0.33.1.linux-arm64.tar.gz sha=4e1ba91f139761f249a1fa6c71e632dfdbdafeda416176ecadefbb95225e56c4 ;; \
          *) echo "buildctl: no build for ${TARGETARCH}" >&2; exit 1 ;; \
        esac; \
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/buildctl.dl "${url}"; \
        echo "${sha}  /tmp/buildctl.dl" | sha256sum --check --strict -; \
        mkdir -p /tmp/buildctl.d; \
        tar -xzf /tmp/buildctl.dl -C /tmp/buildctl.d; \
        install -m 0755 /tmp/buildctl.d/bin/buildctl /usr/local/bin/buildctl; \
        rm -rf /tmp/buildctl.dl /tmp/buildctl.d
  provides:
  - binary: buildctl
    version_command: buildctl --version
  notes: 'Apache-2.0. Checksums: the GitHub release asset digests of moby/buildkit v0.33.1 (each asset also has a sigstore bundle). The published forge image carries it already.'
