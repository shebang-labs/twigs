# yaml-language-server: $schema=https://raw.githubusercontent.com/shebang-labs/twigs/main/schema/twig.json
twig: twig-nest/twig/v1
name: terraform
version: 1.1.0
summary: The Terraform CLI
publisher: Twig Nest project
license: Apache-2.0
tags:
- iac
authenticator_types:
- authenticator_type: terraform.token
  version: 1
  provider: terraform
  summary: A Terraform Cloud or Terraform Enterprise token, for the terraform CLI and the API
  interactive: false
  secrets:
    token:
      as: env
      env: TF_TOKEN_{params.host_var}
  params:
    type: object
    additionalProperties: false
    required:
    - organization
    properties:
      organization:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$
        description: 'The organization the token belongs to, for example example-org.'
      hostname:
        type: string
        pattern: ^[a-z0-9][a-z0-9.-]*(:[0-9]{1,5})?$
        default: app.terraform.io
        description: 'The Terraform Cloud hostname: app.terraform.io (the default) or a Terraform Enterprise host.'
      host_var:
        type: string
        pattern: ^[A-Za-z0-9_]+$
        default: app_terraform_io
        description: The hostname with dots and dashes as underscores, as terraform's TF_TOKEN_<host> names it.
  usage: 'terraform reads TF_TOKEN_{params.host_var}; read-only API calls: curl -H "Authorization: Bearer $TF_TOKEN_{params.host_var}" https://{params.hostname}/api/v2/...'
  requires_tools:
  - sh
  - curl
  preflight:
    authn:
      run: 'sh -c ''curl -fsS -H "Authorization: Bearer $TF_TOKEN_{params.host_var}" https://{params.hostname}/api/v2/organizations/{params.organization}'''
      expect:
        json: $.data.id
      timeout: 20s
  permissions_hint: A team or organization token with read-only access to the workspaces (no apply, no state write); never an owner token.
tools:
- id: terraform
  version: 1.16.4
  summary: The HashiCorp Terraform CLI
  install: |
    ARG TARGETARCH
    RUN set -eu; \
        case "${TARGETARCH}" in \
          amd64) url=https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip sha=dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df ;; \
          arm64) url=https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_arm64.zip sha=8263f301cb1a24489a4adeed147bf28504053f77237b3ea97a0ef2972659de30 ;; \
          *) echo "terraform: no build for ${TARGETARCH}" >&2; exit 1 ;; \
        esac; \
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/terraform.dl "${url}"; \
        echo "${sha}  /tmp/terraform.dl" | sha256sum --check --strict -; \
        mkdir -p /tmp/terraform.d; \
        unzip -q /tmp/terraform.dl -d /tmp/terraform.d; \
        install -m 0755 /tmp/terraform.d/terraform /usr/local/bin/terraform; \
        rm -rf /tmp/terraform.dl /tmp/terraform.d
    ENV CHECKPOINT_DISABLE=1
  provides:
  - binary: terraform
    version_command: terraform version
  notes: 'BUSL-1.1. Checksums: terraform_1.16.4_SHA256SUMS on releases.hashicorp.com. No checkpoint calls.'
