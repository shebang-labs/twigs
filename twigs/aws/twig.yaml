# yaml-language-server: $schema=https://raw.githubusercontent.com/shebang-labs/twigs/main/schema/manifests/twig.json
twig: twig-nest/twig/v1
name: aws
version: 1.0.0
summary: AWS access with access keys, and the AWS CLI
publisher: Twig Nest project
license: Apache-2.0
tags:
- cloud
- aws
authenticator_types:
- authenticator_type: aws.keys
  version: 1
  provider: aws
  summary: An AWS access key pair, and an optional session token, as environment variables
  interactive: false
  secrets:
    access_key_id:
      as: env
      env: AWS_ACCESS_KEY_ID
    secret_access_key:
      as: env
      env: AWS_SECRET_ACCESS_KEY
    session_token:
      as: env
      env: AWS_SESSION_TOKEN
      optional: true
  env:
    AWS_REGION: '{params.region}'
    AWS_DEFAULT_REGION: '{params.region}'
  params:
    type: object
    additionalProperties: false
    properties:
      region:
        type: string
        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]{1,2}$
        description: The default region (AWS_REGION).
  requires_tools:
  - aws
  usage: aws (the key pair is set)
  preflight:
    authn:
      run: aws sts get-caller-identity --output json
      expect:
        json: $.Arn
      timeout: 20s
  permissions_hint: An IAM user or role with ReadOnlyAccess, or narrower; never a key with write permissions below act. Put the key id and the secret into Secrets of the Environment.
tools:
- id: aws
  version: 2.37.4
  summary: The AWS CLI v2
  install: |
    ARG TARGETARCH
    RUN set -eu; \
        case "${TARGETARCH}" in \
          amd64) url=https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.4.zip sha=0c59444563f4df735eeb5481f6165f95dae546c33761760d8be9855d5cfe2d12 ;; \
          arm64) url=https://awscli.amazonaws.com/awscli-exe-linux-aarch64-2.37.4.zip sha=869aa72b9bdb931a9158d0cea9f4f0dc3f7aecf24ea1552da549b87907d28ab2 ;; \
          *) echo "aws: no build for ${TARGETARCH}" >&2; exit 1 ;; \
        esac; \
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/aws.dl "${url}"; \
        echo "${sha}  /tmp/aws.dl" | sha256sum --check --strict -; \
        mkdir -p /tmp/aws.d; \
        unzip -q /tmp/aws.dl -d /tmp/aws.d; \
        /tmp/aws.d/aws/install --install-dir /opt/aws-cli --bin-dir /usr/local/bin; \
        rm -rf /tmp/aws.dl /tmp/aws.d
    ENV AWS_PAGER=""
  provides:
  - binary: aws
    version_command: aws --version
  notes: 'Apache-2.0. AWS publishes a PGP signature per zip, not a checksum file; the checksums were computed from the downloads after the signature verified (AWS CLI Team key FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C). AWS_PAGER is empty: the CLI fails without a pager otherwise.'
