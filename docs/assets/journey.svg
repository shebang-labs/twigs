<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How a Twig travels: you write one YAML file, CI checks it, a person reviews it, the index publishes it, and every Twig Nest can install it in one click.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1218"/>
      <stop offset="0.8" stop-color="#101a24"/>
      <stop offset="1" stop-color="#241c0e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#121a22"/>
    </linearGradient>
    <path id="line" d="M150 150 H 1050"/>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="25.5" fill="none" stroke="#f2bd4f" stroke-opacity="0.18"/>

  <use href="#line" stroke="#f2bd4f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <circle r="5" fill="#ffd676"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#line"/></animateMotion></circle>
  <circle r="4" fill="#4ed6c4"><animateMotion dur="6s" begin="3s" repeatCount="indefinite"><mpath href="#line"/></animateMotion></circle>

  <g font-size="15" font-weight="700" fill="#f5f1e8" text-anchor="middle">
    <g transform="translate(150 150)">
      <rect x="-95" y="-58" width="190" height="116" rx="18" fill="url(#card)" stroke="#f2bd4f" stroke-opacity="0.5"/>
      <text y="-16" fill="#f2bd4f" font-size="11" letter-spacing="1.5">1 · WRITE</text>
      <text y="10">one twig.yaml</text>
      <text y="32" font-size="11" font-weight="400" fill="#9fb0bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make new NAME=…</text>
    </g>
    <g transform="translate(375 150)">
      <rect x="-95" y="-58" width="190" height="116" rx="18" fill="url(#card)" stroke="#f2bd4f" stroke-opacity="0.35"/>
      <text y="-16" fill="#f2bd4f" font-size="11" letter-spacing="1.5">2 · CHECK</text>
      <text y="10">CI on the PR</text>
      <text y="32" font-size="12" font-weight="400" fill="#9fb0bf">schema · pins · version</text>
    </g>
    <g transform="translate(600 150)">
      <rect x="-95" y="-58" width="190" height="116" rx="18" fill="url(#card)" stroke="#f2bd4f" stroke-opacity="0.35"/>
      <text y="-16" fill="#f2bd4f" font-size="11" letter-spacing="1.5">3 · REVIEW</text>
      <text y="10">a person reads it</text>
      <text y="32" font-size="12" font-weight="400" fill="#9fb0bf">like a Dockerfile</text>
    </g>
    <g transform="translate(825 150)">
      <rect x="-95" y="-58" width="190" height="116" rx="18" fill="url(#card)" stroke="#f2bd4f" stroke-opacity="0.35"/>
      <text y="-16" fill="#f2bd4f" font-size="11" letter-spacing="1.5">4 · PUBLISH</text>
      <text y="10">catalog.json</text>
      <text y="32" font-size="12" font-weight="400" fill="#9fb0bf">URL and SHA-256</text>
    </g>
    <g transform="translate(1050 150)">
      <rect x="-95" y="-58" width="190" height="116" rx="18" fill="url(#card)" stroke="#4ed6c4" stroke-opacity="0.55"/>
      <text y="-16" fill="#4ed6c4" font-size="11" letter-spacing="1.5">5 · INSTALL</text>
      <text y="10">every Nest</text>
      <text y="32" font-size="12" font-weight="400" fill="#9fb0bf">one click, or by MCP</text>
      <circle cx="78" cy="-42" r="4" fill="#4ed6c4"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g fill="#ffd676">
    <circle cx="70" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="50" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="30" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="270" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
